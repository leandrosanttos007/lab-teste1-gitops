apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-teste1
  namespace: dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lab-teste1
  template:
    metadata:
      labels:
        app: lab-teste1
    spec:
      containers:
      - name: lab-teste1
        image: leohurin/lab-teste1:061e527065d08dc765ca280bee8c3bb8b1475811
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 15
